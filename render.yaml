# Render Blueprint — deploy the web service only.
# The PostgreSQL database lives on Supabase (https://supabase.com) — its free
# tier does NOT expire, unlike Render's free database (which is deleted after
# 30 days).
#
# This file MUST live in the REPOSITORY ROOT (not in webapp/) so Render's
# Blueprint feature finds it automatically. The app code is under webapp/,
# pointed to by rootDir below.
#
# See webapp/README.md for the full step-by-step (create the DB on Supabase,
# paste the connection string as DATABASE_URL in the Render dashboard).
#
# Cost: $0 (Supabase free DB + Render free web service).

services:
  - type: web
    name: stock
    env: python
    region: frankfurt     # change to your nearest region
    plan: free
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # SECRET_KEY: Render generates this automatically.
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL: paste the Supabase connection string here in the Render
      # dashboard (Dashboard > your service > Environment). It looks like:
      #   postgresql://postgres.xxxx:password@aws-0-region.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false       # set manually in the dashboard
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: "3.11.9"
