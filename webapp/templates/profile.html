{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card"><div class="card-body">
      <h5 class="mb-1 fw-bold"><i class="bi bi-key"></i> {{ tr('menu.change_password') }}</h5>
      <p class="text-muted small mb-4">{{ current_user.username }}</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">{{ tr('profile.old_password') }}</label>
          <input type="password" name="old_password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ tr('profile.new_password') }}</label>
          <input type="password" name="new_password" class="form-control" minlength="4" required>
        </div>
        <div class="mb-4">
          <label class="form-label">{{ tr('profile.confirm_password') }}</label>
          <input type="password" name="confirm_password" class="form-control" minlength="4" required>
        </div>
        <div class="d-flex justify-content-between">
          <a href="{{ url_for('inventory') }}" class="btn btn-outline-secondary">{{ tr('btn.cancel') }}</a>
          <button type="submit" class="btn btn-primary">{{ tr('btn.save') }}</button>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
