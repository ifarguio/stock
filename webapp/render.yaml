# Render Blueprint — deploy with "New > Blueprint" pointing at this repo,
# or create the services manually. See webapp/README.md for step-by-step.
#
# IMPORTANT: Render's free PostgreSQL database expires 30 days after
# creation. For real use, upgrade the database to a paid plan (~$6/mo).

databases:
  - name: inventory-db
    plan: free            # upgrade to "starter" (~$6/mo) for no-expiry
    databaseName: inventory

services:
  - type: web
    name: inventory-orders
    env: python
    region: frankfurt     # change to your nearest region
    plan: free
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_APP
        value: app.py
