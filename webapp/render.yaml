# Render Blueprint — deploy the web service only.
# The PostgreSQL database lives on Neon (https://neon.tech) — its free tier
# does NOT expire after 30 days, unlike Render's free database.
#
# See webapp/README.md for the full step-by-step (create the DB on Neon,
# paste the connection string as DATABASE_URL here).
#
# Cost: $0 (Neon free DB + Render free web service).

services:
  - type: web
    name: stock
    env: python
    region: frankfurt     # change to your nearest region
    plan: free
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # SECRET_KEY: generate a random one, or let Render generate it.
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL: paste the Neon connection string here in the Render
      # dashboard (Dashboard > your service > Environment). It looks like:
      #   postgresql://user:pass@ep-xxx.region.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false       # set manually in the dashboard
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: "3.11.9"
